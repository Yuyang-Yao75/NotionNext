name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/notionnext-org/NotionNext.git
          git fetch upstream main --prune

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main is already up to date with upstream."
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            mapfile -t conflict_files < <(git diff --name-only --diff-filter=U)

            if [[ ${#conflict_files[@]} -eq 1 && "${conflict_files[0]}" == ".github/workflows/sync.yaml" ]]; then
              echo "Only the fork-specific sync workflow conflicted; keeping the fork version."
              git checkout --ours -- .github/workflows/sync.yaml
              git add .github/workflows/sync.yaml
              git commit --no-edit
            else
              echo "::error::Upstream merge has conflicts that require manual review."
              printf '%s\n' "${conflict_files[@]}"
              exit 1
            fi
          fi

          git push origin HEAD:main
