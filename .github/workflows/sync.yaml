name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: upstream-sync-main
  cancel-in-progress: false

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout target repo
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/notionnext-org/NotionNext.git
          git fetch upstream main --prune

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main is already up to date with upstream."
            exit 0
          fi

          if ! git merge --no-edit upstream/main; then
            echo "::error::Upstream merge has conflicts in the files listed below."
            git diff --name-only --diff-filter=U
            exit 1
          fi

          git push origin HEAD:main
